<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12Aviator Admin - Control Center</title>
    <style>
        body { margin: 0; background: #0b0e11; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 90%; max-width: 400px; background: #1b1c1d; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        /* Login Style */
        #login-box input { width: 80%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; text-align: center; font-size: 18px; }
        
        /* Dashboard Style */
        #admin-dashboard { display: none; }
        .status-card { background: #2b2c2d; padding: 15px; border-radius: 12px; margin-bottom: 25px; border-bottom: 3px solid #eab308; }
        .status-card span { font-size: 14px; color: #aaa; text-transform: uppercase; }
        .status-card h2 { margin: 5px 0; color: #eab308; }

        .btn { width: 100%; padding: 20px; margin: 10px 0; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-mode-auto { background: #3498db; color: white; }
        .btn-mode-manual { background: #f39c12; color: white; }
        .btn-crash { background: #e74c3c; color: white; height: 100px; font-size: 24px; border: 4px solid rgba(255,255,255,0.2); }
        .btn:active { transform: scale(0.95); }
        
        .footer-note { font-size: 12px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container" id="login-box">
        <h2 style="color:#e74c3c">ADMIN LOGIN</h2>
        <p>Enter Master Password</p>
        <input type="password" id="passInput" placeholder="••••••••">
        <button class="btn btn-mode-auto" onclick="checkLogin()">LOGIN</button>
    </div>

    <div class="container" id="admin-dashboard">
        <div class="status-card">
            <span>Current Game Mode</span>
            <h2 id="currentModeDisplay">AUTO</h2>
        </div>

        <button id="modeBtn" class="btn btn-mode-manual" onclick="toggleMode()">Switch to Manual</button>
        
        <div id="manual-controls" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #444; display: none;">
            <p style="color: #ef4444; font-weight: bold;">MANUAL CONTROL ACTIVE</p>
            <button class="btn btn-crash" onclick="triggerCrash()">CRASH NOW 🚀</button>
        </div>

        <p class="footer-note">Logged in as Master Admin</p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyChTxo_8hg_6_y2e5BvXQWcpMW-j_wGSOLs",
        databaseURL: "https://mygameonlin-default-rtdb.firebaseio.com",
        projectId: "mygameonlin",
        appId: "1:847986328262:web:823c64f1faf63f768c4dc7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentMode = 'auto';

    // ১. লগইন ফাংশন
    window.checkLogin = () => {
        const pass = document.getElementById('passInput').value;
        if(pass === "Rifat1993") {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            listenToGame();
        } else {
            alert("ভুল পাসওয়ার্ড সোনা ভাই!");
        }
    }

    // ২. গেমের বর্তমান অবস্থা দেখা
    function listenToGame() {
        onValue(ref(db, 'settings/gameControl'), (snap) => {
            if(snap.exists()){
                currentMode = snap.val().mode;
                document.getElementById('currentModeDisplay').innerText = currentMode.toUpperCase();
                
                const mBtn = document.getElementById('modeBtn');
                const manualBox = document.getElementById('manual-controls');

                if(currentMode === 'manual') {
                    mBtn.innerText = "Switch to Auto Mode";
                    mBtn.className = "btn btn-mode-auto";
                    manualBox.style.display = 'block';
                } else {
                    mBtn.innerText = "Switch to Manual Mode";
                    mBtn.className = "btn btn-mode-manual";
                    manualBox.style.display = 'none';
                }
            }
        });
    }

    // ৩. মোড পরিবর্তন করা
    window.toggleMode = () => {
        const nextMode = (currentMode === 'auto') ? 'manual' : 'auto';
        update(ref(db, 'settings/gameControl'), { 
            mode: nextMode,
            manualTrigger: false 
        });
    }

    // ৪. বিমান ক্রাশ করানো
    window.triggerCrash = () => {
        update(ref(db, 'settings/gameControl'), { manualTrigger: true });
        
        // ১ সেকেন্ড পর ট্রিগার আবার অফ করে দেওয়া যাতে পরের রাউন্ডে ঝামেলা না হয়
        setTimeout(() => {
            update(ref(db, 'settings/gameControl'), { manualTrigger: false });
        }, 1000);
    }
</script>
</body>
</html>
